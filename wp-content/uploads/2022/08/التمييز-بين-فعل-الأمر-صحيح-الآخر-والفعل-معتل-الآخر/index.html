<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التمييز بين فعل الأمر صحيح الآخر ومعتل الآخر – أقرأ بالعربية</title>
  <link rel="stylesheet" href="../../../../themes/kindori/assets/css/bootstrap.min.css">
  <style>
    body { direction: rtl; text-align: right; background: #f8fafc; font-family: Tahoma, Arial, sans-serif; padding: 28px 0; }
    .card-box { background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 10px 28px rgba(15,23,42,0.08); border: 2px solid #cbd5e1; }
    .anim-stage { background: linear-gradient(135deg,#dbeafe,#ede9fe); border-radius: 14px; padding: 24px; text-align: center; margin-bottom: 18px; }
    .choice-btn { font-weight: 700; padding: 10px 18px; margin: 6px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; cursor: pointer; }
    .choice-btn.ok { border-color: #16a34a; background: #dcfce7; color: #166534; }
    .choice-btn.bad { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container" style="max-width:760px;">
    <div class="card-box">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge badge-info px-3 py-2">درس مرئي تفاعلي</span>
        <a href="../../../../../index.html" class="btn btn-outline-secondary btn-sm">العودة للرئيسية</a>
      </div>
      <h3 class="font-weight-bold mb-3">التمييز بين فعل الأمر صحيح الآخر ومعتل الآخر</h3>
      <div class="anim-stage">
        <p class="lead font-weight-bold text-dark mb-3">فعل الأمر الصحيح الآخر يُبنى على السكون مثل: (اكتُبْ، اقرأْ)، أما معتل الآخر فيُبنى على حذف حرف العلة مثل: (ادعُ، امشِ، اسعَ).</p>
        <button id="speakBtn" class="btn btn-primary btn-sm">🔊 استمع للشرح</button>
      </div>
      <div class="p-3 bg-light rounded border">
        <strong>أيٌّ من الأفعال الآتية فعلُ أمرٍ معتلُّ الآخر؟</strong>
        <div class="mt-2" id="opts"></div>
        <div id="msg" class="mt-2 font-weight-bold"></div>
      </div>
    </div>
  </div>
  <script src="../../../../../wp-includes/js/jquery/jquery.min.js"></script>
  <script>
    (function ($) {
      var opts = ["اكْتُبْ","اسْعَ","افْتَحْ"];
      var ans = 1;
      opts.forEach(function (o, i) {
        $('<button class="choice-btn">' + o + '</button>').on('click', function () {
          if (i === ans) {
            $(this).addClass('ok');
            $('#msg').removeClass('text-danger').addClass('text-success').text('إجابة صحيحة! أحسنت ⭐');
          } else {
            $(this).addClass('bad');
            $('#msg').removeClass('text-success').addClass('text-danger').text('حاول مرة أخرى!');
          }
        }).appendTo('#opts');
      });
      $('#speakBtn').on('click', function () {
        if ('speechSynthesis' in window) {
          var u = new SpeechSynthesisUtterance("فعل الأمر الصحيح الآخر يُبنى على السكون مثل: (اكتُبْ، اقرأْ)، أما معتل الآخر فيُبنى على حذف حرف العلة مثل: (ادعُ، امشِ، اسعَ).");
          u.lang = 'ar-SA';
          window.speechSynthesis.speak(u);
        }
      });
    })(window.jQuery);
  </script>
</body>
</html>
