<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أَدَواتُ الاِسْتْفْهامِ 1 – أقرأ بالعربية</title>
  <link rel="stylesheet" href="../../themes/kindori/assets/css/bootstrap.min.css">
  <style>
    body { direction: rtl; text-align: right; background: #fefce8; font-family: Tahoma, Arial, sans-serif; padding: 24px 0; }
    .lesson-card { background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 10px 30px rgba(15,23,42,0.08); border: 2px solid #fde047; }
    .choice-btn { font-weight: 700; padding: 12px 18px; margin: 6px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; cursor: pointer; transition: 0.2s; }
    .choice-btn:hover { border-color: #ca8a04; background: #fef9c3; transform: translateY(-2px); }
    .choice-btn.ok { border-color: #16a34a; background: #dcfce7; color: #166534; }
    .choice-btn.bad { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container" style="max-width:760px;">
    <div class="lesson-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge badge-warning px-3 py-2">أدوات الاستفهام (الحزمة 2)</span>
        <a href="../../../index.html" class="btn btn-outline-secondary btn-sm">العودة للرئيسية</a>
      </div>
      <h3 class="font-weight-bold text-dark mb-2">أَدَواتُ الاِسْتْفْهامِ 1</h3>
      <p class="text-muted">اختر أداة الاستفهام المناسبة للجملة:</p>
      <div id="quizBox" class="p-3 bg-light rounded border mb-3"></div>
      <div id="feedback" class="font-weight-bold mb-3"></div>
      <div class="d-flex justify-content-between">
        <button id="speakBtn" class="btn btn-outline-primary btn-sm">🔊 استمع للجملة</button>
        <button id="nextBtn" class="btn btn-primary btn-sm">السؤال التالي ←</button>
      </div>
    </div>
  </div>
  <script src="../../../wp-includes/js/jquery/jquery.min.js"></script>
  <script>
    (function ($) {
      var QS = [
        { q: '....... تذهب إلى المدرسة صباحاً؟', opts: ['مَتَى', 'أَيْنَ', 'مَنْ'], ans: 0 },
        { q: '....... يعيشُ السمكُ؟', opts: ['مَتَى', 'أَيْنَ', 'كَمْ'], ans: 1 },
        { q: '....... شرحَ الدرسَ للطلابِ؟', opts: ['مَاذَا', 'مَنْ', 'هَلْ'], ans: 1 },
        { q: '....... تحبُّ قراءةَ القصصِ؟', opts: ['هَلْ', 'مَتَى', 'أَيْنَ'], ans: 0 }
      ];
      var i = 0;
      function draw() {
        var item = QS[i];
        $('#feedback').text('');
        var $qb = $('#quizBox').html('<h5 class="font-weight-bold mb-3">' + item.q + '</h5><div id="opts"></div>');
        item.opts.forEach(function (o, idx) {
          $('<button class="choice-btn">' + o + '</button>').on('click', function () {
            if (idx === item.ans) {
              $(this).addClass('ok');
              $('#feedback').removeClass('text-danger').addClass('text-success').text('إجابة صحيحة! أحسنت 🌟');
            } else {
              $(this).addClass('bad');
              $('#feedback').removeClass('text-success').addClass('text-danger').text('حاول مرة أخرى!');
            }
          }).appendTo($qb.find('#opts'));
        });
      }
      $('#speakBtn').on('click', function () {
        if ('speechSynthesis' in window) {
          var u = new SpeechSynthesisUtterance(QS[i].q.replace(/\.+/g, ''));
          u.lang = 'ar-SA';
          window.speechSynthesis.speak(u);
        }
      });
      $('#nextBtn').on('click', function () { i = (i + 1) % QS.length; draw(); });
      draw();
    })(window.jQuery);
  </script>
</body>
</html>
