      var STORIES = RAW_STORIES.map(function (r, idx) {
        return {
          id: idx + 1,
          title: r[0],
          level: r[1],
          cat: r[2],
          p1: r[3],
          p2: r[4],
          q: r[5],
          opts: r[6],
          ans: r[7]
        };
      });

      var sid = localStorage.getItem('iread_selected_student_id') || '4';
      var readMap = JSON.parse(localStorage.getItem('iread_books_' + sid) || '{}');

      function renderGrid() {
        var lvl = $('#levelFilters .btn-primary').attr('data-lvl') || 'all';
        var q = ($('#storySearch').val() || '').trim();
        var assignIds = window.IREAD_WEEKLY ? window.IREAD_WEEKLY.getAssignments().storyIds : [];
        var $g = $('#storiesGrid').empty();
        STORIES.forEach(function (s) {
          if (lvl !== 'all' && s.level !== lvl) return;
          if (q && s.title.indexOf(q) === -1 && s.cat.indexOf(q) === -1) return;
          var isWeekly = assignIds.indexOf(s.id) !== -1;
          var badge = readMap[s.id]
            ? '<span class="badge badge-success">مقروءة ✓</span>'
            : '<span class="badge badge-secondary">' + s.level + '</span>';
          var weeklyTag = isWeekly ? '<span class="badge badge-warning text-white ml-1">📌 تكليف أسبوعي</span>' : '';
          var scene = cartoonScene(s, 1);
          var nanoImg = pickNanoImg(s);
          $g.append(
            '<div class="col-sm-6 col-md-4 col-lg-3 mb-4">' +
              '<div class="book-card" style="' + (isWeekly ? 'border:2px solid #f59e0b;' : '') + '">' +
                '<div class="book-cover" style="background:' + scene.bg + '"><img class="cover-img" src="' + nanoImg + '" alt="' + s.title + '"></div>' +
                '<div class="book-body">' +
                  '<div class="d-flex justify-content-between align-items-center mb-2"><div>' + badge + weeklyTag + '</div><small class="text-muted">' + s.cat + '</small></div>' +
                  '<h6 class="font-weight-bold mb-3 flex-grow-1">' + s.id + '. ' + s.title + '</h6>' +
                  '<a href="../القصة-الأسبوعية/index.html?story=' + s.id + '" class="btn btn-warning btn-sm btn-block text-white font-weight-bold mb-2">📖 الكتاب الورقي (11 سؤالاً)</a>' +
                  '<button type="button" class="btn btn-outline-primary btn-sm btn-block open-book" data-id="' + s.id + '">قراءة سريعة</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        });
      }

      function speak(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'ar-SA';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }
      }

      function openReader(bookId) {
        var s = STORIES.find(function (x) { return x.id === bookId; });
        if (!s) return;
        var page = 1;
        function drawPage() {
          var $rv = $('#readerView').removeClass('d-none').empty();
          var scene = cartoonScene(s, page);
          var bodyHtml = '';
          if (page === 1) {
            bodyHtml = '<div class="story-page-card">' +
                '<div class="scene-frame" style="background:' + scene.bg + '"><img class="cartoon-img" src="' + pickNanoImg(s) + '" alt="' + s.title + '"><span class="badge badge-light mt-2 px-3 py-1">صفحة 1 من 3</span></div>' +
                '<div class="story-text">' + s.p1 + '</div>' +
              '</div>' +
              '<div class="d-flex justify-content-between"><button class="btn btn-outline-primary btn-sm" id="listenBtn">🔊 استمع</button><button class="btn btn-primary" id="nextPg">الصفحة التالية ←</button></div>';
          } else if (page === 2) {
            bodyHtml = '<div class="story-page-card">' +
                '<div class="scene-frame" style="background:' + scene.bg + '">' + scene.svg + '<span class="badge badge-light mt-2 px-3 py-1">صفحة 2 من 3</span></div>' +
                '<div class="story-text">' + s.p2 + '</div>' +
              '</div>' +
              '<div class="d-flex justify-content-between"><button class="btn btn-outline-secondary" id="prevPg">→ السابقة</button><button class="btn btn-outline-primary btn-sm" id="listenBtn">🔊 استمع</button><button class="btn btn-primary" id="nextPg">سؤال الفهم ←</button></div>';
          } else {
            bodyHtml = '<div class="story-page-card">' +
                '<div class="scene-frame" style="background:' + scene.bg + '">' + scene.svg + '<span class="badge badge-light mt-2 px-3 py-1">سؤال الفهم (صفحة 3 من 3)</span></div>' +
                '<div class="quiz-panel">' +
                  '<div class="d-flex justify-content-between align-items-center flex-wrap">' +
                    '<span class="quiz-badge">🎯 اختبر فهمك للقصة</span>' +
                    '<button class="btn btn-outline-primary btn-sm" id="listenQBtn">🔊 استمع للسؤال</button>' +
                  '</div>' +
                  '<div class="quiz-question">' + s.q + '</div>' +
                  '<div class="quiz-options" id="qOpts"></div>' +
                '</div>' +
              '</div>' +
              '<div id="qMsg" class="mb-3"></div>' +
              '<div class="d-flex justify-content-between align-items-center">' +
                '<button class="btn btn-outline-secondary btn-sm" id="prevPg">→ العودة للقصة</button>' +
                (s.id < STORIES.length ? '<button class="btn btn-success btn-sm" id="nextStoryBtn">القصة التالية ←</button>' : '') +
              '</div>';
          }

          $rv.html(
            '<div class="reader-box">' +
              '<div class="d-flex justify-content-between align-items-center mb-3">' +
                '<h4 class="font-weight-bold mb-0">' + s.title + ' <small class="text-muted">(' + s.level + ')</small></h4>' +
                '<button class="btn btn-sm btn-outline-danger" id="closeReader">إغلاق القارئ</button>' +
              '</div>' +
              bodyHtml +
            '</div>'
          );

          if (page === 3) {
            var letters = ['أ', 'ب', 'ج', 'د'];
            s.opts.forEach(function (opt, i) {
              var $ob = $('<button type="button" class="choice-btn"><span class="choice-letter">' + letters[i] + '</span><span>' + opt + '</span></button>');
              $ob.on('click', function () {
                if (i === s.ans) {
                  $ob.addClass('ok');
                  readMap[s.id] = true;
                  localStorage.setItem('iread_books_' + sid, JSON.stringify(readMap));
                  $('#qMsg').html('<div class="quiz-reward ok">🎉 أحسنت! إجابة صحيحة، أتممت قراءة القصة بنجاح ⭐</div>');
                  var icons = ['⭐', '🎉', '🌟', '✨', '🏆'];
                  var $box = $('.reader-box');
                  for (var c = 0; c < 14; c++) {
                    var $cf = $('<span class="confetti-piece">' + icons[c % icons.length] + '</span>');
                    $cf.css({ left: (8 + Math.random() * 84) + '%', animationDelay: (Math.random() * 0.3) + 's' });
                    $box.append($cf);
                    (function ($el) { setTimeout(function () { $el.remove(); }, 1800); })($cf);
                  }
                  renderGrid();
                } else {
                  $ob.addClass('bad');
                  $('#qMsg').html('<div class="quiz-reward bad">💡 قريب جداً! حاول اختيار إجابة أخرى</div>');
                }
              });
              $('#qOpts').append($ob);
            });
            $('#listenQBtn').on('click', function () { speak(s.q); });
            $('#nextStoryBtn').on('click', function () { openReader(s.id + 1); });
          }

          $('#listenBtn').on('click', function () { speak(page === 1 ? s.p1 : s.p2); });
          $('#nextPg').on('click', function () { page++; drawPage(); });
          $('#prevPg').on('click', function () { page--; drawPage(); });
          $('#closeReader').on('click', function () { $('#readerView').addClass('d-none'); });
        }
        drawPage();
        window.scrollTo({ top: 180, behavior: 'smooth' });
      }

      $(document).on('click', '.open-book', function () {
        openReader(parseInt($(this).attr('data-id'), 10));
      });

      $('#levelFilters button').on('click', function () {
        $('#levelFilters button').removeClass('btn-primary').addClass('btn-outline-primary');
        $(this).removeClass('btn-outline-primary').addClass('btn-primary');
        renderGrid();
      });

      $('#storySearch').on('input', renderGrid);
      renderGrid();
    })(window.jQuery);
  </script>
</body>
</html>
