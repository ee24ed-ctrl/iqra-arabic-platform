<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>مدارس الساحل الأهلية – أَقْرَأُ بِالْعَرَبِيَّةِ</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-900: #06285a;
      --navy-800: #0a3977;
      --blue-700: #0d52b8;
      --blue-600: #1668e3;
      --blue-500: #2484ff;
      --sky-100: #e5effb;
      --sky-50: #f2f7fd;
      --gold-500: #eab308;
      --gold-400: #f59e0b;
      --card-bg: rgba(255, 255, 255, 0.96);
      --input-bg: #eef4fb;
      --input-border: #cedff2;
      --text-dark: #092c5c;
      --text-muted: #5b7496;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      font-family: 'Cairo', 'Tajawal', Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #1b64c8 0%, #d8e9fa 34%, #eef5fc 72%, #d4e6f9 100%);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* =====================================================================
       1. FLASH INTRO VIDEO OVERLAY (مقدمة افتراضية ملء الشاشة بدون أزرار أو إطار)
       ===================================================================== */
    .flash-intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      background: #081b33;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .flash-intro-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .flash-video {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
       object-position: center center;
      display: block;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      pointer-events: none;
      background: #081b33;
    }

    /* في الكمبيوتر والتابليت يتوسط الفيديو نظراً لأبعاده العمودية */
    @media (min-width: 768px) {
      .flash-video {
        width: auto;
        height: 100vh;
        height: 100dvh;
        max-width: 100vw;
        object-fit: contain;
        margin: 0 auto;
      }
    }

    /* =====================================================================
       2. MOBILE-FIRST LOGIN & REGISTRATION PAGE (أولاً: تصميم الجوال < 640px)
       ===================================================================== */
    .auth-page-wrapper {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      background: linear-gradient(180deg, #1b65c9 0%, #dcebfa 38%, #f2f7fd 72%, #d7e8fa 100%);
    }

    .auth-shell {
      width: 100%;
      max-width: 473px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      padding-bottom: 18px;
    }

    /* Top visual banner matching uploaded design */
    .hero-banner-box {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #cfe3f9;
    }

    .hero-banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Desktop extra info inside hero (hidden on mobile, visible on desktop) */
    .hero-desktop-extras {
      display: none;
    }

    /* Main column holding white card + language pills + slogan */
    .form-column {
      width: 100%;
      padding: 0 18px;
      margin-top: -10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* White frosted rounded card */
    .auth-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 30px;
      padding: 24px 20px 22px;
      box-shadow: 0 18px 42px rgba(11, 56, 120, 0.13), 0 2px 8px rgba(11, 56, 120, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    /* Pill inputs matching screenshot */
    .pill-input-group {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
    }

    .pill-input {
      width: 100%;
      height: 56px;
      border-radius: 999px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      padding: 0 54px 0 48px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: right;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 5px rgba(15, 52, 108, 0.05);
    }

    html[dir="ltr"] .pill-input {
      text-align: left;
      padding: 0 48px 0 54px;
    }

    .pill-input::placeholder {
      color: #6b7f99;
      font-weight: 700;
    }

    .pill-input:focus {
      border-color: var(--blue-600);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(22, 104, 227, 0.14);
    }

    .pill-icon-right {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #083c82;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    html[dir="ltr"] .pill-icon-right {
      right: auto;
      left: 20px;
    }

    .pill-icon-left {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #0b3c7d;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    html[dir="ltr"] .pill-icon-left {
      left: auto;
      right: 18px;
    }

    /* Forgot password link row */
    .forgot-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      margin: 2px 6px 16px;
    }

    .forgot-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 800;
      color: #1060b8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .forgot-btn:hover {
      color: #063977;
      text-decoration: underline;
    }

    .question-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0d74d6;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Glossy Blue Primary Button (تسجيل الدخول) */
    .btn-glossy-primary {
      width: 100%;
      height: 58px;
      border-radius: 999px;
      border: 1.5px solid #08439c;
      background: linear-gradient(180deg, #2789ff 0%, #0d5bd1 52%, #0741a6 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(10, 68, 168, 0.34), inset 0 2px 1px rgba(255, 255, 255, 0.45);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      margin-bottom: 13px;
    }

    .btn-glossy-primary:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 13px 26px rgba(10, 68, 168, 0.42), inset 0 2px 2px rgba(255, 255, 255, 0.55);
    }

    .btn-glossy-primary:active {
      transform: translateY(0);
    }

    .btn-icon-end {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }

    html[dir="ltr"] .btn-icon-end {
      right: auto;
      left: 22px;
    }

    /* Outlined Secondary Button (سجل الآن مجاناً) */
    .btn-pill-outline {
      width: 100%;
      height: 56px;
      border-radius: 999px;
      border: 2px solid #164482;
      background: linear-gradient(180deg, #f7fbff 0%, #e6f0fc 100%);
      color: #082e66;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(11, 49, 107, 0.08);
      transition: all 0.16s ease;
    }

    .btn-pill-outline:hover {
      background: #dcebfa;
      transform: translateY(-1px);
    }

    /* Role selector pills inside Login & Register views */
    .role-selector-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }

    .role-pill-btn {
      border: 1.5px solid #cbdcf0;
      background: #f2f7fd;
      color: #0b356e;
      border-radius: 14px;
      min-height: 54px;
      padding: 6px 3px;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.15s ease;
      text-align: center;
      line-height: 1.2;
    }

    .role-pill-btn.active {
      background: linear-gradient(180deg, #217ef8 0%, #0b51bc 100%);
      color: #fff;
      border-color: #09439e;
      box-shadow: 0 5px 12px rgba(13, 82, 184, 0.25);
    }

    .reg-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .reg-select {
      width: 100%;
      height: 50px;
      border-radius: 999px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      padding: 0 20px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-dark);
      outline: none;
    }

    /* Quick Demo & Platform Access Drawer inside Card */
    .quick-access-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #cddff3;
      text-align: center;
    }

    .quick-access-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .quick-chips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .quick-chip {
      width: 100%;
      height: 36px;
      border: 1px solid #c5daf2;
      background: #f0f6fe;
      color: #0b3978;
      border-radius: 12px;
      padding: 0 8px;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: all 0.15s ease;
    }
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .quick-chip:hover {
      background: #1668e3;
      color: #fff;
      border-color: #1668e3;
    }

    /* Status / Feedback Alert */
    .auth-feedback {
      margin-top: 12px;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 800;
      text-align: center;
      display: none;
    }

    .auth-feedback.is-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .auth-feedback.is-success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .auth-feedback.is-info {
      display: block;
      background: #e0f2fe;
      color: #075985;
      border: 1px solid #7dd3fc;
    }

    /* Language Switcher Pills below Card (العربية | English) */
    .lang-switcher-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 12px;
      margin-top: 16px;
      padding: 0 4px;
    }

    .lang-pill {
      height: 48px;
      border-radius: 999px;
      border: 1.5px solid #c5dbf2;
      background: linear-gradient(180deg, #f6faff 0%, #e3effc 100%);
      color: #092c5c;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(12, 58, 124, 0.09);
      transition: all 0.18s ease;
    }

    .lang-pill.active {
      border-color: #8ab8ec;
      background: linear-gradient(180deg, #e7f2fe 0%, #d3e6fb 100%);
      box-shadow: 0 8px 18px rgba(12, 58, 124, 0.15);
    }

    .lang-pill:hover {
      transform: translateY(-1px);
    }

    /* Divider with Open Book Icon & Slogan */
    .slogan-section {
      width: 100%;
      margin-top: 18px;
      text-align: center;
      padding: 0 12px;
    }

    .book-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .book-divider::before,
    .book-divider::after {
      content: "";
      flex: 1;
      max-width: 125px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, #5f8ec9, transparent);
    }

    .slogan-text {
      font-size: 1.16rem;
      font-weight: 900;
      color: #082f68;
      letter-spacing: 0.1px;
    }

    /* Bottom Blue & Gold Wave Footer matching uploaded image */
    .bottom-wave-wrap {
      width: 100%;
      line-height: 0;
      margin-top: auto;
      pointer-events: none;
    }

    .bottom-wave-svg {
      width: 100%;
      height: 64px;
      display: block;
    }

    .d-none {
      display: none !important;
    }

    /* =====================================================================
       3. DESKTOP DESIGN (ثانياً: تصميم الكمبيوتر >= 1025px)
       ===================================================================== */
    @media (min-width: 1025px) {
      .auth-page-wrapper {
        justify-content: center;
        padding: 32px 28px 80px;
        background: radial-gradient(circle at 80% 15%, #2b7de9 0%, #cde2f9 42%, #eaf3fc 78%, #cbe0f8 100%);
      }

      .auth-shell {
        max-width: 1120px;
        display: grid;
        grid-template-columns: 1.08fr 0.98fr;
        align-items: stretch;
        gap: 34px;
        background: rgba(255, 255, 255, 0.48);
        backdrop-filter: blur(16px);
        border-radius: 38px;
        padding: 26px;
        box-shadow: 0 28px 70px rgba(7, 41, 94, 0.18);
        border: 1.5px solid rgba(255, 255, 255, 0.85);
      }

      .hero-banner-box {
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(180deg, #dbeafa 0%, #edf5fd 100%);
        box-shadow: 0 14px 34px rgba(9, 48, 105, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.9);
        overflow: hidden;
      }

      .hero-banner-img {
        width: 100%;
        max-height: 410px;
        object-fit: cover;
      }

      .hero-desktop-extras {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px 24px 22px;
        background: linear-gradient(180deg, rgba(235, 245, 255, 0.6) 0%, rgba(255, 255, 255, 0.92) 100%);
        border-top: 1px solid rgba(190, 216, 246, 0.6);
      }

      .hero-badges-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .hero-mini-card {
        background: #ffffff;
        border: 1px solid #d5e6f8;
        border-radius: 16px;
        padding: 10px 12px;
        text-align: center;
        box-shadow: 0 4px 12px rgba(10, 56, 122, 0.05);
      }

      .hero-mini-card strong {
        display: block;
        font-size: 0.9rem;
        color: #08336e;
      }

      .hero-mini-card span {
        font-size: 0.76rem;
        color: #567094;
        font-weight: 700;
      }

      .form-column {
        margin-top: 0;
        padding: 0;
        justify-content: center;
      }

      .auth-card {
        padding: 30px 28px 24px;
        border-radius: 28px;
      }

      .reg-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .bottom-wave-wrap {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1;
      }
    }

    /* =====================================================================
       4. TABLET DESIGN (ثالثاً: تصميم التابليت 640px – 1024px)
       ===================================================================== */
    @media (min-width: 640px) and (max-width: 1024px) {
      .auth-page-wrapper {
        padding: 20px 20px 0;
      }

      .auth-shell {
        max-width: 660px;
        background: rgba(255, 255, 255, 0.42);
        backdrop-filter: blur(14px);
        border-radius: 34px;
        padding: 18px 18px 24px;
        box-shadow: 0 22px 54px rgba(8, 45, 102, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.8);
      }

      .hero-banner-box {
        border-radius: 26px;
        max-height: 390px;
        box-shadow: 0 10px 26px rgba(9, 48, 105, 0.1);
      }

      .form-column {
        margin-top: 14px;
        padding: 0 10px;
      }

      .auth-card {
        padding: 28px 28px 24px;
        border-radius: 28px;
      }

      .reg-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .lang-switcher-row {
        max-width: 520px;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/mobile-responsive.css">
</head>
<body>

  <!-- ===================================================================
       STEP 1: FLASH INTRO VIDEO SCREEN (مقدمة افتراضية بدون أزرار أو إطار)
       =================================================================== -->
  <section id="flashIntroScreen" class="flash-intro-overlay" aria-label="فيديو المقدمة">
    <video id="flashIntroVideo" class="flash-video" src="./assets/intro-flash.mp4" autoplay playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback" preload="auto"></video>
  </section>

  <!-- ===================================================================
       STEP 2: LOGIN & REGISTRATION SCREEN (صفحة التسجيل المتجاوبة)
       =================================================================== -->
  <div class="auth-page-wrapper">
    <main class="auth-shell">

      <!-- Right / Top Hero Banner (مدارس الساحل الأهلية - أقرأ بالعربية) -->
      <section class="hero-banner-box">
        <img src="./assets/sahil-header-clean.jpg" alt="مدارس الساحل الأهلية - أقرأ بالعربية" class="hero-banner-img">
        <div class="hero-desktop-extras">
          <div class="hero-badges-grid">
            <div class="hero-mini-card">
              <strong>📚 +3000 مصدر</strong>
              <span>قصص وكتب تفاعلية</span>
            </div>
            <div class="hero-mini-card">
              <strong>🎮 تعلّم بالمتعة</strong>
              <span>ألعاب وتحديات ذكية</span>
            </div>
            <div class="hero-mini-card">
              <strong>📊 تقارير فورية</strong>
              <span>للطالب والمعلم والإدارة</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Left / Bottom Form Column -->
      <section class="form-column">
        <div class="auth-card">

          <!-- LOGIN VIEW (Default) -->
          <form id="loginViewForm" autocomplete="on">
            <div class="role-selector-grid" id="loginRoleGrid">
              <button type="button" class="role-pill-btn active" data-role="student"><span>🎓</span><span>طالب</span></button>
              <button type="button" class="role-pill-btn" data-role="teacher"><span>👩‍🏫</span><span>معلم</span></button>
              <button type="button" class="role-pill-btn" data-role="admin"><span>🏫</span><span>مدير</span></button>
              <button type="button" class="role-pill-btn" data-role="supervisor"><span>🧭</span><span>مشرف تربوي</span></button>
              <button type="button" class="role-pill-btn" data-role="general_supervisor"><span>🏛️</span><span>مشرف عام</span></button>
            </div>

            <!-- Username Pill -->
            <div class="pill-input-group">
              <span class="pill-icon-right" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2.5c-3.34 0-10 1.68-10 5v2.5h20v-2.5c0-3.32-6.66-5-10-5z"/>
                </svg>
              </span>
              <input type="text" id="loginIdentifier" class="pill-input" placeholder="إسم المستخدم" required>
            </div>

            <!-- Password Pill -->
            <div class="pill-input-group">
              <span class="pill-icon-right" aria-hidden="true">
                <svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 11c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                </svg>

              <input type="password" id="loginPass" class="pill-input" placeholder="كلمة المرور" required>

                <svg id="eyeIconSlash" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>

            <!-- Forgot Password Link -->

            <!-- Primary Login Button -->

          <!-- REGISTER VIEW (Toggled when clicking سجل الآن مجاناً) -->
          <form id="registerViewForm" class="d-none" autocomplete="on">
            <div class="role-selector-grid" id="regRoleGrid">

              <button type="button" class="role-pill-btn" data-role="teacher"><span>👩‍🏫</span><span>معلم</span></button>
              <button type="button" class="role-pill-btn" data-role="admin"><span>🏫</span><span>مدير</span></button>
              <button type="button" class="role-pill-btn" data-role="supervisor"><span>🧭</span><span>مشرف تربوي</span></button>

            <div class="reg-grid">

              <div class="pill-input-group" style="margin-bottom:0;">

                <input type="text" id="regUsername" class="pill-input" placeholder="إسم المستخدم الجديد" required>
              </div>
              <div class="pill-input-group" style="margin-bottom:0;">
                <span class="pill-icon-right">🔒</span>
                <input type="password" id="regPassword" class="pill-input" placeholder="كلمة المرور (4 أحرف+)" required>
              </div>
              <div class="pill-input-group" style="margin-bottom:0;">
                <span class="pill-icon-right">🏫</span>
                <input type="text" id="regSchool" class="pill-input" value="مدارس الساحل الأهلية" placeholder="اسم المدرسة" required>
              </div>
              <select id="regGrade" class="reg-select">
                <option value="الصف الأول">الصف الأول</option>
                <option value="الصف الثاني">الصف الثاني</option>
                <option value="الصف الثالث">الصف الثالث</option>
                <option value="الصف الرابع">الصف الرابع</option>
                <option value="الصف الخامس">الصف الخامس</option>
                <option value="الصف السادس">الصف السادس</option>
              </select>
              <select id="regSection" class="reg-select">
                <option value="أ">فصل أ</option>
                <option value="ب">فصل ب</option>
                <option value="ج">فصل ج</option>
              </select>
              <select id="regLevel" class="reg-select">
                <option value="المستوى (ز)">المستوى (ز)</option>
                <option value="مستوى أ">مستوى القراءة: أ</option>
                <option value="مستوى ب">مستوى القراءة: ب</option>
                <option value="مستوى ج">مستوى القراءة: ج</option>

            <button type="submit" class="btn-glossy-primary">

          <!-- Feedback Message Box -->
          <div id="authFeedbackBox" class="auth-feedback" role="status" aria-live="polite"></div>

          <!-- Quick Demo & Platform Navigation Strip -->
          <div class="quick-access-box">
            <div class="quick-access-title" id="quickAccessTitle">⚡ دخول مباشر حسب الصفة أو استعراض المنصة:</div>
            <div class="quick-chips">
              <button type="button" class="quick-chip demo-login-chip" data-role="student">🎓 طالب</button>
              <button type="button" class="quick-chip demo-login-chip" data-role="teacher">👩‍🏫 معلم</button>
              <button type="button" class="quick-chip demo-login-chip" data-role="admin">🏫 مدير</button>
              <button type="button" class="quick-chip demo-login-chip" data-role="supervisor">🧭 مشرف تربوي</button>
              <button type="button" class="quick-chip demo-login-chip" data-role="general_supervisor">🏛️ مشرف عام</button>
              <a href="./home.html" class="quick-chip">🏠 المنصة الرئيسية</a>
              <button type="button" id="replayFlashBtn" class="quick-chip">🎬 فيديو البداية</button>

        </div>

        <!-- Language Switcher Pills (العربية | English) -->
        <div class="lang-switcher-row">
          <button type="button" id="langArBtn" class="lang-pill active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b469c" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>

          <button type="button" id="langEnBtn" class="lang-pill" dir="ltr">

                <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>

                <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>

                <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>

        <!-- Open Book Divider + Slogan -->
        <div class="slogan-section">

              <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/>
            </svg>
          </div>
          <p class="slogan-text" id="sloganText">بالتعليم .. نصنع مستقبلاً أفضل</p>
        </div>
      </section>

    </main>

    <!-- Bottom Blue & Gold Wave matching screenshot -->
    <div class="bottom-wave-wrap" aria-hidden="true">
      <svg class="bottom-wave-svg" viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path d="M0,35 C360,115 980,5 1440,65 L1440,120 L0,120 Z" fill="#eab308"/>
        <path d="M0,46 C380,122 990,14 1440,74 L1440,120 L0,120 Z" fill="#0948a8"/>
        <path d="M0,68 C440,128 1040,36 1440,92 L1440,120 L0,120 Z" fill="#052c6e"/>
      </svg>
    </div>

  <script src="./assets/js/auth-system.js"></script>
  <script>
    (function () {
      'use strict';

      var BASE_PREFIX = decodeURIComponent(window.location.pathname || '').indexOf('/التسجيل/') !== -1 ? '../' : './';
      var flashScreen = document.getElementById('flashIntroScreen');
      var flashVideo = document.getElementById('flashIntroVideo');
      var replayFlashBtn = document.getElementById('replayFlashBtn');

      var loginViewForm = document.getElementById('loginViewForm');
      var registerViewForm = document.getElementById('registerViewForm');
      var openRegisterBtn = document.getElementById('openRegisterBtn');
      var backToLoginBtn = document.getElementById('backToLoginBtn');
      var togglePassBtn = document.getElementById('togglePassBtn');
      var loginIdentifier = document.getElementById('loginIdentifier');
      var loginPass = document.getElementById('loginPass');
      var forgotPassBtn = document.getElementById('forgotPassBtn');
      var feedbackBox = document.getElementById('authFeedbackBox');

      var selectedRole = 'student';
      var flashDismissed = false;

      function hideFlashIntro() {
        if (flashDismissed) return;
        flashDismissed = true;
        if (flashVideo) {
          try { flashVideo.pause(); } catch (e) {}
        }
        if (flashScreen) {
          flashScreen.classList.add('is-hidden');
        }
      }

      function startVideoWithAutoSound() {
        if (!flashVideo) return;
        flashVideo.currentTime = 0;
        flashVideo.muted = false;
        flashVideo.volume = 1.0;

        var p = flashVideo.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {
            // إذا فرض المتصفح كتم الصوت المبدئي قبل التفاعل، يبدأ التشغيل فوراً ويفعّل الصوت تلقائياً مع أول لمسة دون توقف
            flashVideo.muted = true;
            var p2 = flashVideo.play();
            if (p2 && typeof p2.catch === 'function') {
              p2.catch(function () {
                setTimeout(hideFlashIntro, 3500);
              });
            }
          });
        }
      }

      function ensureUnmutedAndPlaying(e) {
        if (flashDismissed || !flashVideo) return;
        if (e && e.type === 'contextmenu') {
          e.preventDefault();
        }
        if (flashVideo.muted) {
          flashVideo.muted = false;
          flashVideo.volume = 1.0;
        }
        if (flashVideo.paused && !flashVideo.ended) {
          try { flashVideo.play(); } catch (err) {}
        }
      }

      function showFlashIntro() {
        flashDismissed = false;
        if (flashScreen) {
          flashScreen.classList.remove('is-hidden');
        }
        startVideoWithAutoSound();
      }

      // Skip if ?skipIntro=1 is passed
      if (window.location.search.indexOf('skipIntro=1') !== -1) {
        hideFlashIntro();
      } else if (flashVideo) {
        flashVideo.addEventListener('ended', hideFlashIntro);
        flashVideo.addEventListener('error', hideFlashIntro);

        // منع توقف الفيديو عند اللمس أو النقر
        flashVideo.addEventListener('pause', function () {
          if (!flashDismissed && !flashVideo.ended) {
            try { flashVideo.play(); } catch (e) {}
          }
        });

        ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function (evt) {
          document.addEventListener(evt, ensureUnmutedAndPlaying, { passive: true });
        });
        if (flashScreen) {
          flashScreen.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        }

        startVideoWithAutoSound();
        // Safety fallback timer (10.5 seconds max)
        setTimeout(hideFlashIntro, 10500);
      }

      if (replayFlashBtn) {
        replayFlashBtn.addEventListener('click', showFlashIntro);
      }

      function showFeedback(type, msg) {
        feedbackBox.className = 'auth-feedback is-' + type;
        feedbackBox.innerHTML = msg;
      }

      // Toggle Password visibility
      if (togglePassBtn && loginPass) {
        togglePassBtn.addEventListener('click', function () {
          var isPass = loginPass.getAttribute('type') === 'password';
          loginPass.setAttribute('type', isPass ? 'text' : 'password');
        });
      }

      var DEFAULT_ROLE_USERS = {
        student: 'yusuf',
        teacher: 'teacher1',
        admin: 'admin1',
        supervisor: 'sup1',
        general_supervisor: 'gsup1'
      };

      // Forgot Password Helper
      if (forgotPassBtn) {
        forgotPassBtn.addEventListener('click', function () {
          var defUser = DEFAULT_ROLE_USERS[selectedRole] || 'yusuf';
          loginIdentifier.value = defUser;
          loginPass.value = '1234';
          showFeedback('info', '💡 تم تعبئة بيانات الدخول الافتراضية (اسم المستخدم: <b>' + defUser + '</b> | كلمة المرور: <b>1234</b>). اضغط على <b>تسجيل الدخول</b> الآن.');
        });
      }

      // Switch between Login and Register forms
      if (openRegisterBtn) {
        openRegisterBtn.addEventListener('click', function () {
          loginViewForm.classList.add('d-none');
          registerViewForm.classList.remove('d-none');
          feedbackBox.className = 'auth-feedback';
        });
      }

      if (backToLoginBtn) {
        backToLoginBtn.addEventListener('click', function () {
          registerViewForm.classList.add('d-none');
          loginViewForm.classList.remove('d-none');
          feedbackBox.className = 'auth-feedback';
        });
      }

      // Role pills in Login & Register forms
      var roleBtns = document.querySelectorAll('.role-pill-btn');
      roleBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          selectedRole = btn.getAttribute('data-role') || 'student';
          roleBtns.forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-role') === selectedRole);
          });
        });
      });

      function redirectUser(user) {
        var A = window.IREAD_AUTH;
        var meta = (A && A.ROLE_META && A.ROLE_META[user.role]) ? A.ROLE_META[user.role] : { home: 'بوابة-الطالب/index.html' };
        setTimeout(function () {
          window.location.href = BASE_PREFIX + meta.home;
        }, 650);
      }

      // Login Submit
      if (loginViewForm) {
        loginViewForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var A = window.IREAD_AUTH;
          if (!A) return;
          var res = A.loginUser(loginIdentifier.value, loginPass.value, selectedRole);
          if (!res.ok) {
            // Try without role filter in case username belongs to a specific role directly
            res = A.loginUser(loginIdentifier.value, loginPass.value);
          }
          if (!res.ok) {
            var defU = DEFAULT_ROLE_USERS[selectedRole] || 'yusuf';
            showFeedback('error', res.error || ('بيانات الدخول غير صحيحة. جرب: ' + defU + ' وكلمة المرور: 1234'));
            return;
          }
          showFeedback('success', '✅ أهلاً بك يا ' + res.user.name + '! جاري تحويلك إلى صفحتك...');
          redirectUser(res.user);
        });
      }

      // Register Submit
      if (registerViewForm) {
        registerViewForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var A = window.IREAD_AUTH;
          if (!A) return;
          var res = A.registerUser({
            role: selectedRole,
            name: document.getElementById('regFullName').value,
            username: document.getElementById('regUsername').value,
            pass: document.getElementById('regPassword').value,
            school: document.getElementById('regSchool').value,
            grade: document.getElementById('regGrade').value,
            section: document.getElementById('regSection') ? document.getElementById('regSection').value : 'أ',
            level: document.getElementById('regLevel').value
          });
          if (!res.ok) {
            showFeedback('error', res.error);
            return;
          }
          showFeedback('success', '🎉 تم إنشاء حسابك بنجاح يا ' + res.user.name + '! جاري الدخول...');
          redirectUser(res.user);
        });
      }

      // Quick Demo Login Chips
      var demoChips = document.querySelectorAll('.demo-login-chip');
      demoChips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          var role = chip.getAttribute('data-role');
          var A = window.IREAD_AUTH;
          if (!A) return;
          var res = A.quickDemoLogin(role);
          if (res.ok) {
            showFeedback('success', '⚡ تم الدخول السريع بحساب: ' + res.user.name);
            redirectUser(res.user);
          }
        });
      });

      // Language Switcher (العربية / English)
      var langArBtn = document.getElementById('langArBtn');
      var langEnBtn = document.getElementById('langEnBtn');

      function setLanguage(lang) {
        var isEn = lang === 'en';
        document.documentElement.lang = isEn ? 'en' : 'ar';
        document.documentElement.dir = isEn ? 'ltr' : 'rtl';
        langArBtn.classList.toggle('active', !isEn);
        langEnBtn.classList.toggle('active', isEn);

        loginIdentifier.placeholder = isEn ? 'Username' : 'إسم المستخدم';
        loginPass.placeholder = isEn ? 'Password' : 'كلمة المرور';
        document.getElementById('forgotPassText').textContent = isEn ? 'Forgot Password?' : 'هل نسيت كلمة المرور؟';
        document.getElementById('loginBtnLabel').textContent = isEn ? 'Sign In' : 'تسجيل الدخول';
        document.getElementById('registerBtnLabel').textContent = isEn ? 'Register Now for Free' : 'سجل الآن مجاناً';
        document.getElementById('sloganText').textContent = isEn ? 'Through Education .. We Build a Better Future' : 'بالتعليم .. نصنع مستقبلاً أفضل';
        document.getElementById('quickAccessTitle').textContent = isEn ? '⚡ Instant Demo Access or Browse Platform:' : '⚡ دخول تجريبي فوري أو استعراض المنصة:';
      }

      if (langArBtn) langArBtn.addEventListener('click', function () { setLanguage('ar'); });
      if (langEnBtn) langEnBtn.addEventListener('click', function () { setLanguage('en'); });
    })();
  </script>
</body>
